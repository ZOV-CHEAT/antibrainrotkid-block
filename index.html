<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANTIBRAINROT_KID HACKED THIS SITE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      min-height: 100vh;
      width: 100%;
      font-family: 'Arial', 'Helvetica', sans-serif;
      overflow: hidden;
      cursor: pointer;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .glow-text {
      color: #fff;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 30px;
      margin-bottom: 10px;
      text-shadow:
        0 0 5px #fff, 0 0 10px #fff, 0 0 20px #fff,
        0 0 40px #ccc, 0 0 60px #aaa;
      animation: subtlePulse 2s infinite alternate;
      padding: 0 20px;
      word-break: break-word;
    }
    .click-hint {
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 20px;
      text-shadow:
        0 0 4px #fff, 0 0 8px #fff, 0 0 16px #ccc, 0 0 24px #aaa;
      animation: hintPulse 1.6s infinite alternate;
      padding: 0 20px;
      transition: opacity 0.6s ease;
    }
    .click-hint.hidden { opacity: 0; pointer-events: none; }
    @keyframes subtlePulse {
      0%   { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #fff, 0 0 40px #bbb, 0 0 60px #888; opacity: .95; }
      100% { text-shadow: 0 0 8px #fff, 0 0 16px #fff, 0 0 28px #fff, 0 0 50px #ddd, 0 0 80px #aaa; opacity: 1; }
    }
    @keyframes hintPulse {
      0%   { text-shadow: 0 0 4px #fff, 0 0 8px #fff, 0 0 14px #bbb; opacity: .7; }
      100% { text-shadow: 0 0 6px #fff, 0 0 12px #fff, 0 0 22px #ddd; opacity: 1; }
    }
    .video-container {
      position: fixed;
      left: 0; bottom: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      pointer-events: none;
    }
    .video-container video {
      max-width: 80vw; max-height: 70vh;
      width: auto; height: auto;
      object-fit: contain;
      display: block;
      box-shadow: 0 0 30px rgba(255,255,255,.2);
      border: none; outline: none;
      pointer-events: auto;
      margin-bottom: 10px; margin-left: 10px;
      background: black;
    }
    .image-container {
      position: fixed;
      right: 0; top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      pointer-events: none;
      padding-right: 10px;
    }
    .image-container img {
      max-width: 40vw;
      max-height: 80vh;
      width: auto; height: auto;
      object-fit: contain;
      display: block;
      box-shadow: 0 0 30px rgba(255,255,255,.2);
      border: none; outline: none;
      pointer-events: auto;
      background: black;
    }
    video::-webkit-media-controls,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-start-playback-button,
    audio::-webkit-media-controls,
    audio::-webkit-media-controls-panel {
      display: none !important;
      -webkit-appearance: none;
    }
    audio { display: none; }
  </style>
</head>
<body>

  <h1 class="glow-text">ANTIBRAINROT_KID HACKED THIS SITE</h1>
  <p class="click-hint" id="clickHint">CLICK FOR THE MUSIC</p>

  <div class="video-container">
    <video
      src="https://raw.githubusercontent.com/ZOV-CHEAT/antibrainrotkid-block/refs/heads/main/rampage.mp4"
      autoplay loop muted playsinline
      controlslist="nodownload" disablepictureinpicture
    ></video>
  </div>

  <div class="image-container">
    <img
      src="https://raw.githubusercontent.com/ZOV-CHEAT/antibrainrotkid-block/refs/heads/main/image.png"
      alt=""
    >
  </div>

  <audio
    id="bg-music"
    src="https://raw.githubusercontent.com/ZOV-CHEAT/antibrainrotkid-block/refs/heads/main/music.mp3"
    loop preload="auto"
  ></audio>

  <script>
    (function() {
      const audio = document.getElementById('bg-music');
      const video = document.querySelector('video');
      const hint = document.getElementById('clickHint');
      let started = false;

      function hideHint() { hint.classList.add('hidden'); }

      function tryStart() {
        if (started) return;
        const p = audio.play();
        if (p !== undefined) {
          p.then(() => {
            started = true;
            hideHint();
            cleanup();
          }).catch(() => {});
        }
        if (video.paused) video.play().catch(() => {});
      }

      function cleanup() {
        ['click','touchstart','keydown','mousedown','pointerdown'].forEach(ev =>
          document.removeEventListener(ev, tryStart, true)
        );
      }

      tryStart();
      ['click','touchstart','keydown','mousedown','pointerdown'].forEach(ev =>
        document.addEventListener(ev, tryStart, { once: false, capture: true })
      );
    })();
  </script>
</body>
</html>
